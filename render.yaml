services:
  - type: web
    name: viral-studio-motor-cloud
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: VS_CONCURRENCY
        value: "1"
      - key: NODE_ENV
        value: production
      - key: MAX_CONCURRENCY
        value: "1"
      - key: MAX_BATCH
        value: "10"
